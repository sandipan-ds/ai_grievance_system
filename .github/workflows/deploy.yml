name: CI/CD Pipeline to Hugging Face Spaces

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout codebase
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # 2. Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # 3. Cache Pip dependencies for faster subsequent runs
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 4. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Download NLTK data
        run: |
          python -m nltk.downloader wordnet omw-1.4 stopwords

      # 5. Run Unit Tests (using mock models to avoid downloading heavy weights)
      - name: Run Unit Tests
        env:
          MOCK_MODELS: "1"
        run: |
          pytest

      # 6. Push to Hugging Face Spaces (Only runs on push to main/master, not on pull requests)
      - name: Deploy to Hugging Face Spaces
        if: github.event_name == 'push' && success()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add hf https://sandipanarnab:$HF_TOKEN@huggingface.co/spaces/sandipanarnab/grievance_iq
          git push hf HEAD:main --force
